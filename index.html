<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Make Naruto hand seals at your webcam and cast the jutsu. The seal detector runs on your device." />
    <meta name="theme-color" content="#f0973f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f7f7f7'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%23111' stroke-width='3'/%3E%3Cpath d='M10 22 L22 10' stroke='%23d42a2a' stroke-width='4'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before the first paint, so there is no flash.
      try { var t = localStorage.getItem('jutsu:theme'); document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' } catch (e) {}
    </script>
    <title>Jutsu · make the seals, cast the jutsu</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Jutsu needs JavaScript to open the camera and read your hand seals.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
